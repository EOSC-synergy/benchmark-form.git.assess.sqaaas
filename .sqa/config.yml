      github.com/OSTrails/benchmark-form jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.wheat_witty_bear.sh
        container: qc.sty_cream_confident_donkey
  QC.Ver:
    repos:
      github.com/OSTrails/benchmark-form get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.banana_flexible_buffalo.sh
        container: qc.ver_avocado_sweet_viper
timeout: 5400
